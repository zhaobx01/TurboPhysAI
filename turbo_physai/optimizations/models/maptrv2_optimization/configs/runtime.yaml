schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

# Self-contained defaults taken from the validated MapTRv2 launch script.
# They are not universal requirements: MIOpen/Inductor values are tuning
# defaults, while NCCL values assume the validated eight-card topology.
environment:
  set:
    # MIOpen / rocBLAS settings used by the MapTRv2 launch recipe.
    PYTORCH_MIOPEN_SUGGEST_NHWC: "1"
    MIOPEN_PRECISION_FP32_FP32_FP32_TF32_FP32: "1"
    # MIOpen counterpart of torch.backends.cudnn.benchmark: exhaustively
    # search for the fastest convolution solver once and cache it.
    MIOPEN_FIND_MODE: "1"
    ROCBLAS_MATH_MODE: "1"

    # RCCL defaults for the validated eight-card topology.
    # Override these for a different NIC/GPU topology.
    NCCL_TOPO_FILE: "null"
    NCCL_ALGO: Ring
    NCCL_RINGS: "N0 0 7 6 5 4 3 2 1 N0|N1 1 2 3 4 5 6 7 0 N1|N2 2 1 0 7 6 5 4 3 N2|N3 3 4 5 6 7 0 1 2 N3|N4 4 3 2 1 0 7 6 5 N4|N5 5 6 7 0 1 2 3 4 N5|N6 6 5 4 3 2 1 0 7 N6|N7 7 0 1 2 3 4 5 6 N7"
    ALLREDUCE_STREAM_WITH_COMPUTE: "1"
    HSA_FORCE_FINE_GRAIN_PCIE: "1"

    # Inductor layout and tuning settings.
    TORCHINDUCTOR_LAYOUT_OPTIMIZATION: "1"
    TORCHINDUCTOR_COORDINATE_DESCENT_TUNING: "1"
    # Inductor conv autotuning backend used by the maptrv2.compile group.
    TORCHINDUCTOR_MAX_AUTOTUNE_CONV_BACKENDS: ATEN
    TORCHINDUCTOR_CACHE_DIR: /tmp/maptrv2/torchinductor

    # Explicit switches for every maptrv2.* group that is enabled by default.
    TURBO_PHYSAI_CHANNELS_LAST: "1"
    TURBO_PHYSAI_CHANNELS_LAST_SCOPE: model
    # The reference implementation calls set_float32_matmul_precision("high");
    # set TURBO_PHYSAI_MATMUL_PRECISION=off to restore the stock numerics.
    TURBO_PHYSAI_MATMUL_PRECISION: high
    TURBO_PHYSAI_CUDNN_BENCHMARK: "1"
    TURBO_PHYSAI_FORK_START_METHOD: "1"
    TURBO_PHYSAI_DATALOADER_START_METHOD: fork
    TURBO_PHYSAI_PIN_MEMORY: "1"
    TURBO_PHYSAI_DISABLE_PV_MASK: "0"
  unset: []

# The reference implementation ships tools/dist_train_numa.sh, so the recipe
# keeps NUMA-aware placement enabled.
process:
  numa: true
