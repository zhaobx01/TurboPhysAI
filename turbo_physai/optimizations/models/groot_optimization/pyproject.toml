[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-physai-groot-optimization"
version = "0.1.0"
description = "groot optimizations developed with TurboPhysAI"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["groot_optimization*"]
