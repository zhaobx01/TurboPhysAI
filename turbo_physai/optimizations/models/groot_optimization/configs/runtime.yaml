schema_version: turbophysai/runtime-config/v1
kind: RuntimeConfig

environment:
  # Local Cosmos checkpoint for the current workspace. Override with
  # --set VLM_MODEL_PATH=/path/to/checkpoint on another machine.
  set:
    VLM_MODEL_PATH: /workspace/data/checkpoints/nvidia/Cosmos-Reason2-2B
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    USE_WANDB: "0"

    # Use MIOpen find mode to avoid runtime kernel search and improve performance.
    MIOPEN_FIND_MODE: "1"
    # Use NHWC layout for MIOpen kernels to match the reference launcher's torchcodec and default compiler-cache setup.
    PYTORCH_MIOPEN_SUGGEST_NHWC: "1"
    # MIOPEN_PRECISION_FP32_FP32_FP32_TF32_FP32: "1"
    # DISABLE_ADDMM_CUDA_LT: "1"
  # Match the reference launcher's torchcodec and default compiler-cache setup.
  unset:
    - VIDEO_DECODER_BACKEND
    - TORCHINDUCTOR_CACHE_DIR
    - TRITON_CACHE_DIR
    - TORCH_LOGS
    - TORCH_TRACE
    - CUDA_LAUNCH_BLOCKING
    - HIP_LAUNCH_BLOCKING

# The reference training command does not request PhysAI NUMA binding.
# NUMA placement, visible devices, rank count and training parameters are
# deployment-specific and should be configured by the launcher.
process:
  numa: false
