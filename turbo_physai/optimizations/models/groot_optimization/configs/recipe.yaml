schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig

metadata:
  id: model.groot.development.hcu
  version: "0.1.0"
  description: groot optimization development config

model:
  name: groot

optimization_modules:
  - groot_optimization.catalog

compatibility: {}

# Regenerate the optimization config after changing Group settings.
optimization_groups:
  - id: groot.dit.hip_math_sdpa
    enabled: true
  - id: groot.data.pad_156
    enabled: true
  - id: groot.qwen.fast_pos_embed_interpolate
    enabled: true
  - id: groot.qwen.rot_pos_emb
    enabled: true
  - id: groot.qwen.get_rope_index
    enabled: true
  - id: groot.qwen.flash_attn_dynamo_disable
    enabled: true
  - id: groot.compile.qwen_vision_block
    enabled: true
  - id: groot.compile.dit
    enabled: true
  - id: groot.compile.vl
    enabled: true
  - id: groot.data.pixel_values_bf16
    enabled: true
  - id: groot.optim.apex_fused_adam
    enabled: true
  - id: groot.zero2.grad_reduce_overlap
    enabled: true
  - id: groot.qwen.disable_kv_cache
    enabled: true
  - id: groot.compile.qwen_text_layer
    enabled: true
  - id: groot.zero2.owner_reduce
    enabled: true
  - id: groot.zero2.allgather_pipeline
    enabled: true